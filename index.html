```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Batalla Live Telegram</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b1120;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      touch-action: manipulation;
      user-select: none;
    }
    .progress-bar-smooth {
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glow-blue {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }
    .glow-pink {
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 pb-8">

  <!-- Header En Vivo -->
  <header class="text-center mt-2 flex flex-col items-center">
    <div class="flex items-center gap-2 bg-red-600/20 border border-red-500/40 text-red-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider animate-pulse">
      <span class="w-2 h-2 rounded-full bg-red-500"></span>
      <span>EN VIVO - BATALLA DE REGALOS</span>
    </div>
    <h1 class="text-2xl font-black mt-3 tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-pink-500">
      STREAMING BATTLE
    </h1>
  </header>

  <!-- Marcador y Barra Competitiva Estilo TikTok -->
  <main class="w-full max-w-sm bg-slate-900/90 border border-slate-800 rounded-3xl p-5 shadow-2xl backdrop-blur-md">
    
    <!-- Puntuación actual -->
    <div class="flex justify-between items-center mb-4 text-sm font-black">
      <div class="flex items-center gap-2">
        <span class="text-cyan-400">TEAM AZUL</span>
        <span id="score-a" class="bg-cyan-950/80 border border-cyan-800/80 text-cyan-300 px-2.5 py-1 rounded-xl text-xs glow-blue">
          500 pts
        </span>
      </div>
      <div class="flex items-center gap-2">
        <span id="score-b" class="bg-pink-950/80 border border-pink-800/80 text-pink-300 px-2.5 py-1 rounded-xl text-xs glow-pink">
          500 pts
        </span>
        <span class="text-pink-400">TEAM ROSA</span>
      </div>
    </div>

    <!-- Barra de Carga Competitiva -->
    <div class="w-full bg-slate-950 h-10 rounded-2xl overflow-hidden flex border-2 border-slate-800 relative p-1 shadow-inner">
      <div id="bar-a" class="bg-gradient-to-r from-cyan-500 to-blue-600 h-full rounded-xl progress-bar-smooth flex items-center justify-start pl-3 text-xs font-black text-white" style="width: 50%;">
        <span id="percent-a">50%</span>
      </div>
      <div id="bar-b" class="bg-gradient-to-r from-pink-500 to-rose-600 h-full rounded-xl progress-bar-smooth flex items-center justify-end pr-3 text-xs font-black text-white ml-auto" style="width: 50%;">
        <span id="percent-b">50%</span>
      </div>
    </div>

    <div class="mt-4 text-center">
      <p id="status-text" class="text-xs text-slate-400">¡Envía un regalo para apoyar a tu creador favorito!</p>
    </div>
  </main>

  <!-- Botones de Acción (Simulación de Regalos) -->
  <footer class="w-full max-w-sm grid grid-cols-2 gap-3">
    <button onclick="sendGift('A', 50)" class="bg-gradient-to-b from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 active:scale-95 text-white font-extrabold py-3.5 px-4 rounded-2xl shadow-lg border border-cyan-400/30 flex flex-col items-center justify-center transition-all">
      <span class="text-base flex items-center gap-1">🎁 Apoyar Azul</span>
      <span class="text-[10px] font-normal opacity-90">+50 Puntos</span>
    </button>

    <button onclick="sendGift('B', 50)" class="bg-gradient-to-b from-pink-500 to-rose-600 hover:from-pink-400 hover:to-rose-500 active:scale-95 text-white font-extrabold py-3.5 px-4 rounded-2xl shadow-lg border border-pink-400/30 flex flex-col items-center justify-center transition-all">
      <span class="text-base flex items-center gap-1">🎁 Apoyar Rosa</span>
      <span class="text-[10px] font-normal opacity-90">+50 Puntos</span>
    </button>
  </footer>

  <script>
    // Inicializar la API de Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let scoreA = 500;
    let scoreB = 500;

    function updateUI() {
      const total = scoreA + scoreB;
      const percentA = Math.round((scoreA / total) * 100);
      const percentB = 100 - percentA;

      document.getElementById('score-a').innerText = `${scoreA.toLocaleString()} pts`;
      document.getElementById('score-b').innerText = `${scoreB.toLocaleString()} pts`;

      document.getElementById('bar-a').style.width = `${percentA}%`;
      document.getElementById('bar-b').style.width = `${percentB}%`;

      document.getElementById('percent-a').innerText = `${percentA}%`;
      document.getElementById('percent-b').innerText = `${percentB}%`;
    }

    function sendGift(team, points) {
      if (team === 'A') scoreA += points;
      if (team === 'B') scoreB += points;

      // Vibración táctil en teléfonos móviles mediante Telegram SDK
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      updateUI();
    }
  </script>
</body>
</html>
```
